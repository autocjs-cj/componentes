<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>🏭 Locais e Sub-locais - Controle de Materiais</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📦%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="page-header">
                <h2>🏭 Locais e Sub-locais</h2>
                <p></p>
            </div>

            <!-- SITES -->
            <div class="card">
                <div class="card-header">
                    <h3>🏢 Sites</h3>
                    <button class="btn btn-primary" onclick="abrirModalSite()">+ Novo Site</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Locais Vinculados</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-sites">
                            <tr><td colspan="3" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- LOCAIS -->
            <div class="card">
                <div class="card-header">
                    <h3>📍 Locais de Armazenamento</h3>
                    <button class="btn btn-primary" onclick="abrirModalLocal()">+ Novo Local</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Site</th>
                                <th>Nome</th>
                                <th>Sub-locais</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-locais">
                            <tr><td colspan="4" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- SUB-LOCAIS -->
            <div class="card">
                <div class="card-header">
                    <h3>📂 Sub-locais (Prateleiras, Gavetas, etc.)</h3>
                    <button class="btn btn-primary" onclick="abrirModalSublocal()">+ Novo Sub-local</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Local Pai</th>
                                <th>Nome</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-sublocais">
                            <tr><td colspan="3" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- MODAL SITE -->
            <div id="modal-site" class="modal-overlay hidden">
                <div class="modal-confirm" style="max-width: 500px; text-align: left;">
                    <h3 id="titulo-modal-site">🏢 Novo Site</h3>
                    <form id="form-site" class="mt-2">
                        <input type="hidden" id="site-id">
                        <div class="form-group">
                            <label>Nome <span class="required">*</span></label>
                            <input type="text" id="site-nome" required placeholder="Ex: Site A">
                        </div>
                        <div class="btn-group mt-2">
                            <button type="submit" class="btn btn-primary">💾 Salvar</button>
                            <button type="button" class="btn btn-secondary" onclick="fecharModalSite()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- MODAL LOCAL -->
            <div id="modal-local" class="modal-overlay hidden">
                <div class="modal-confirm" style="max-width: 500px; text-align: left;">
                    <h3 id="titulo-modal-local">📍 Novo Local</h3>
                    <form id="form-local" class="mt-2">
                        <input type="hidden" id="local-id">
                        <div class="form-group">
                            <label>Site <span class="required">*</span></label>
                            <select id="local-site-id" required>
                                <option value="">Selecione um site...</option>
                            </select>
                        </div>
                        <div class="form-group mt-1">
                            <label>Nome <span class="required">*</span></label>
                            <input type="text" id="local-nome" required placeholder="Ex: Galpão 01">
                        </div>
                        <div class="btn-group mt-2">
                            <button type="submit" class="btn btn-primary">💾 Salvar</button>
                            <button type="button" class="btn btn-secondary" onclick="fecharModalLocal()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- MODAL SUB-LOCAL -->
            <div id="modal-sublocal" class="modal-overlay hidden">
                <div class="modal-confirm" style="max-width: 500px; text-align: left;">
                    <h3 id="titulo-modal-sublocal">📂 Novo Sub-local</h3>
                    <form id="form-sublocal" class="mt-2">
                        <input type="hidden" id="sublocal-id">
                        <div class="form-group">
                            <label>Local Pai <span class="required">*</span></label>
                            <select id="sublocal-local-id" required>
                                <option value="">Selecione um local...</option>
                            </select>
                        </div>
                        <div class="form-group mt-1">
                            <label>Nome <span class="required">*</span></label>
                            <input type="text" id="sublocal-nome" required placeholder="Ex: Prateleira A1">
                        </div>
                        <div class="btn-group mt-2">
                            <button type="submit" class="btn btn-primary">💾 Salvar</button>
                            <button type="button" class="btn btn-secondary" onclick="fecharModalSublocal()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/pages/locais.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAcesso();
            renderizarMenu();
        });
    </script>
</body>
</html>
