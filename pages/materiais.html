<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Cadastro de Materiais - Controle de Materiais</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu será renderizado dinamicamente pelo JS -->
        <main class="main-content">
            <div class="page-header">
                <h2>📋 Cadastro de Materiais</h2>
                <p></p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>📦 Materiais Cadastrados</h3>
                    <button class="btn btn-primary" onclick="abrirModalNovoMaterial()">+ Novo Material</button>
                    <div class="btn-group">
                        <input type="text" id="buscar-material" placeholder="🔍 Buscar material..." style="width: 250px;">
                        <button class="btn btn-success" onclick="exportarMateriais()">📊 Exportar Excel</button>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Código SAP</th>
                                <th>Nome</th>
                                <th>Local</th>
                                <th>Sub-local</th>
                                <th>Qtd Atual</th>
                                <th>Mín</th>
                                <th>Máx</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-materiais">
                            <tr><td colspan="11" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            

    <!-- MODAL CADASTRO / EDIÇÃO / VISUALIZAÇÃO DO MATERIAL -->
    <div id="modal-material" class="modal-overlay hidden">
        <div class="modal-confirm" style="max-width: 600px; text-align: left;">
            <h3 id="titulo-modal-material">📋 Material</h3>
            <form id="form-modal-material" class="mt-2">
                <input type="hidden" id="modal-material-id">
                <input type="hidden" id="modal-material-modo" value="novo">
                <div class="form-group">
                    <label>Código SAP <span class="required">*</span></label>
                    <input type="text" id="modal-material-codigo" required placeholder="Ex: MAT-001">
                </div>
                <div class="form-group mt-1">
                    <label>Nome <span class="required">*</span></label>
                    <input type="text" id="modal-material-nome" required placeholder="Nome do material">
                </div>
                <div class="form-group mt-1">
                    <label>Descrição</label>
                    <textarea id="modal-material-descricao" placeholder="Descrição detalhada..."></textarea>
                </div>
                <div class="form-group mt-1">
                    <label>Unidade de Medida</label>
                    <select id="modal-material-unidade">
                        <option value="UN">Unidade (UN)</option>
                        <option value="KG">Quilograma (KG)</option>
                        <option value="LT">Litro (LT)</option>
                        <option value="MT">Metro (MT)</option>
                        <option value="CX">Caixa (CX)</option>
                        <option value="PC">Pacote (PC)</option>
                        <option value="RL">Rolo (RL)</option>
                        <option value="PAR">Par (PAR)</option>
                    </select>
                </div>
                <div class="form-group mt-1">
                    <label>Local de Armazenamento</label>
                    <select id="modal-material-local">
                        <option value="">Selecione um local...</option>
                    </select>
                </div>
                <div class="form-group mt-1">
                    <label>Sub-local</label>
                    <select id="modal-material-sublocal">
                        <option value="">Selecione um sub-local...</option>
                    </select>
                </div>
                <div class="form-group mt-1">
                    <label>Estoque Mínimo</label>
                    <input type="number" id="modal-material-estoque-min" min="0" value="0">
                </div>
                <div class="form-group mt-1">
                    <label>Estoque Máximo</label>
                    <input type="number" id="modal-material-estoque-max" min="0" value="999999">
                </div>
                <div class="form-group mt-1">
                    <label>Limite para Compra</label>
                    <input type="number" id="modal-material-limite-compra" min="0" value="0">
                </div>
                <div id="modal-info-estoque" class="hidden mt-1" style="background:#f8fafc;padding:12px;border-radius:8px;">
                    <div style="display:flex;gap:24px;font-size:0.85rem;">
                        <div><strong>Qtd Atual:</strong> <span id="modal-info-atual">0</span></div>
                        <div><strong>Reservado:</strong> <span id="modal-info-reservada">0</span></div>
                        <div><strong>Disponível:</strong> <span id="modal-info-disponivel">0</span></div>
                    </div>
                </div>
                <div class="btn-group mt-2">
                    <button type="button" class="btn btn-primary" onclick="salvarMaterialDoModal()">💾 Salvar</button>
                    <button type="button" class="btn btn-secondary" onclick="fecharModalMaterial()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

        </main>
    </div>
    <script src="../js/pages/materiais.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAcesso();
            renderizarMenu();
        });
    </script>
</body>
</html>
