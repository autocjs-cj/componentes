<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Controle de Estoque - Controle de Materiais</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu será renderizado dinamicamente pelo JS -->
        <main class="main-content">
            <div class="page-header">
                <h2>📦 Controle de Estoque</h2>
                <p></p>
            </div>

            <div class="card-grid">
                <div class="stat-card">
                    <div class="stat-icon green">✅</div>
                    <div class="stat-info">
                        <h4 id="estoque-normal">0</h4>
                        <p>Estoque Normal</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">⚠️</div>
                    <div class="stat-info">
                        <h4 id="estoque-baixo">0</h4>
                        <p>Estoque Baixo</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red">🚨</div>
                    <div class="stat-info">
                        <h4 id="estoque-critico">0</h4>
                        <p>Estoque Crítico</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>📋 Posição de Estoque</h3>
                    <div class="btn-group">
                        <select id="filtro-status" style="width: 180px;">
                            <option value="">Todos os status</option>
                            <option value="NORMAL">Estoque Normal</option>
                            <option value="BAIXO">Estoque Baixo</option>
                            <option value="CRITICO">Estoque Crítico</option>
                        </select>
                        <input type="text" id="buscar-estoque" placeholder="🔍 Buscar..." style="width: 200px;">
                        <button class="btn btn-outline" onclick="filtrarEstoque()">🔍 Filtrar</button>
                        <button class="btn btn-success" onclick="exportarEstoque()">📊 Exportar Excel</button>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Código SAP</th>
                                <th>Material</th>
                                <th>Local</th>
                                <th>Sub-local</th>
                                <th>Qtd Atual</th>
                                <th>Mínimo</th>
                                <th>Máximo</th>
                                <th>Limite Compra</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-estoque">
                            <tr><td colspan="9" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            
        </main>
    </div>
    <script src="../js/pages/estoque.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            renderizarMenu();
        });
    </script>
</body>
</html>
