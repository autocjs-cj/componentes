<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Movimentações de Estoque - Controle de Materiais</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu será renderizado dinamicamente pelo JS -->
        <main class="main-content">
            <div class="page-header">
                <h2>🔄 Movimentações de Estoque</h2>
                <p></p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>📝 Registrar Movimentação</h3>
                </div>
                <form id="form-movimentacao">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Tipo <span class="required">*</span></label>
                            <select id="mov-tipo" required>
                                <option value="">Selecione...</option>
                                <option value="ENTRADA">📥 Entrada (Recebimento)</option>
                                <option value="SAIDA">📤 Saída (Retirada)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Material <span class="required">*</span></label>
                            <select id="mov-material" required>
                                <option value="">Selecione um material...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Quantidade <span class="required">*</span></label>
                            <input type="number" id="mov-quantidade" min="1" required placeholder="Ex: 10">
                        </div>
                        <div class="form-group">
                            <label>Data <span class="required">*</span></label>
                            <input type="date" id="mov-data" required>
                        </div>
                        <div class="form-group">
                            <label>Responsável</label>
                            <input type="text" id="mov-responsavel" placeholder="Nome do responsável">
                        </div>
                        <div class="form-group">
                            <label>Documento de Referência</label>
                            <input type="text" id="mov-documento" placeholder="Nº Nota, OS, etc.">
                        </div>
                    </div>
                    <div class="btn-group mt-2">
                        <button type="submit" class="btn btn-primary">💾 Registrar Movimentação</button>
                        <button type="button" class="btn btn-secondary" onclick="limparFormulario('form-movimentacao')">🔄 Limpar</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>📋 Histórico de Movimentações</h3>
                    <div class="btn-group">
                        <input type="date" id="filtro-data-inicio" style="width: 150px;">
                        <input type="date" id="filtro-data-fim" style="width: 150px;">
                        <select id="filtro-tipo" style="width: 150px;">
                            <option value="">Todos os tipos</option>
                            <option value="ENTRADA">Entradas</option>
                            <option value="SAIDA">Saídas</option>
                        </select>
                        <button class="btn btn-outline" onclick="filtrarMovimentacoes()">🔍 Filtrar</button>
                        <button class="btn btn-success" onclick="exportarMovimentacoes()">📊 Exportar Excel</button>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Tipo</th>
                                <th>Material</th>
                                <th>Qtd</th>
                                <th>Responsável</th>
                                <th>Documento</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-movimentacoes">
                            <tr><td colspan="6" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            
        </main>
    </div>
    <script src="../js/pages/movimentacoes.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAcesso();
            renderizarMenu();
        });
    </script>
</body>
</html>
