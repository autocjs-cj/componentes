<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Recebimento / Retirada - Controle de Materiais</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📦%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="page-header">
                <h2>🔄 Recebimento / Retirada</h2>
                <p></p>
            </div>

            <div class="card">
                <div class="card-header" style="flex-direction: column; align-items: stretch; gap: 16px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>📋 Histórico de Movimentações</h3>
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="abrirModalNovaMovimentacao()">+ Novo</button>
                            <button class="btn btn-success" onclick="exportarMovimentacoes()">📊 Exportar</button>
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
                        <div class="form-group" style="margin: 0; min-width: 140px;">
                            <label style="font-size: 0.75rem; color: var(--secondary); margin-bottom: 4px;">De</label>
                            <input type="date" id="filtro-data-inicio" style="width: 100%; padding: 8px 10px;">
                        </div>
                        <div class="form-group" style="margin: 0; min-width: 140px;">
                            <label style="font-size: 0.75rem; color: var(--secondary); margin-bottom: 4px;">Até</label>
                            <input type="date" id="filtro-data-fim" style="width: 100%; padding: 8px 10px;">
                        </div>
                        <div class="form-group" style="margin: 0; min-width: 140px;">
                            <label style="font-size: 0.75rem; color: var(--secondary); margin-bottom: 4px;">Tipo</label>
                            <select id="filtro-tipo" style="width: 100%; padding: 8px 10px;">
                                <option value="">Todos os tipos</option>
                                <option value="ENTRADA">Entradas</option>
                                <option value="SAIDA">Saídas</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin: 0; min-width: 240px; flex: 1;">
                            <label style="font-size: 0.75rem; color: var(--secondary); margin-bottom: 4px;">Buscar</label>
                            <input type="text" id="buscar-movimentacao" placeholder="🔍 Buscar material, responsável, documento..." style="width: 100%; padding: 8px 12px;">
                        </div>
                        <div class="btn-group" style="margin-bottom: 1px;">
                            <button class="btn btn-outline" onclick="filtrarMovimentacoes()" title="Filtrar">🔍 Filtrar</button>
                            <button class="btn btn-secondary" onclick="limparFiltroMovimentacoes()" title="Limpar">🔄 Limpar</button>
                        </div>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Tipo</th>
                                <th>Material</th>
                                <th>Qtd</th>
                                <th>Responsável</th>
                                <th>Documento</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-movimentacoes">
                            <tr><td colspan="6" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

    <div id="modal-movimentacao" class="modal-overlay hidden">
        <div class="modal-confirm" style="max-width: 500px; text-align: left;">
            <h3 id="titulo-modal-movimentacao">📝 Registrar Movimentação</h3>
            <form id="form-modal-movimentacao" class="mt-2">
                <div class="form-group">
                    <label>Tipo <span class="required">*</span></label>
                    <select id="modal-mov-tipo" required>
                        <option value="">Selecione...</option>
                        <option value="ENTRADA">📥 Entrada (Recebimento)</option>
                        <option value="SAIDA">📤 Saída (Retirada)</option>
                    </select>
                </div>
                <div class="form-group mt-1">
                    <label>Material <span class="required">*</span></label>
                    <select id="modal-mov-material" required>
                        <option value="">Selecione um material...</option>
                    </select>
                </div>
                <div class="form-group mt-1">
                    <label>Quantidade <span class="required">*</span></label>
                    <input type="number" id="modal-mov-quantidade" min="1" required placeholder="Ex: 10">
                </div>
                <div class="form-group mt-1">
                    <label>Data <span class="required">*</span></label>
                    <input type="date" id="modal-mov-data" required>
                </div>
                <div class="form-group mt-1">
                    <label>Responsável</label>
                    <input type="text" id="modal-mov-responsavel" placeholder="Nome do responsável">
                </div>
                <div class="form-group mt-1">
                    <label>OM / Pedido / Reserva</label>
                    <input type="text" id="modal-mov-documento" placeholder="Nº OM, Pedido ou Reserva">
                </div>
                <div class="btn-group mt-2">
                    <button type="button" class="btn btn-primary" onclick="salvarMovimentacaoModal()">💾 Registrar</button>
                    <button type="button" class="btn btn-secondary" onclick="fecharModalMovimentacao()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

<div id="info-soma-retorno" class="hidden mt-1" style="background:#fef3c7;padding:10px 14px;border-radius:8px;font-size:0.85rem;color:#92400e;">
                    <strong>Total informado:</strong> <span id="soma-retorno">0</span> / <span id="soma-maximo">0</span> unidades
                </div>
                <div class="form-group mt-1">
                    <label>Data <span class="required">*</span></label>
                    <input type="date" id="retorno-data" required>
                </div>
                <div class="form-group mt-1">
                    <label>OM / Pedido / Reserva</label>
                    <input type="text" id="retorno-documento" placeholder="Nº OM, Pedido ou Reserva">
                </div>
                <div class="form-group mt-1">
                    <label>Responsável</label>
                    <input type="text" id="retorno-responsavel" placeholder="Nome do responsável">
                </div>
                <div class="form-group mt-1">
                    <label>Observação</label>
                    <textarea id="retorno-observacao" placeholder="Observações sobre o retorno..."></textarea>
                </div>
                <div class="btn-group mt-2">
                    <button type="button" class="btn btn-primary" onclick="salvarRetornoArea()">💾 Registrar Retorno</button>
                    <button type="button" class="btn btn-secondary" onclick="fecharModalRetornoArea()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

        </main>
    </div>
    <script src="../js/pages/movimentacoes.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAcesso();
            renderizarMenu();
        });
    </script>
</body>
</html>
