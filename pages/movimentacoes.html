<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Recebimento / Retirada - Controle de Materiais</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu será renderizado dinamicamente pelo JS -->
        <main class="main-content">
            <div class="page-header">
                <h2>🔄 Recebimento / Retirada</h2>
                <p></p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>📋 Histórico</h3>
                    <button class="btn btn-primary" onclick="abrirModalNovaMovimentacao()">+ Nova Movimentação</button>
                    <div class="btn-group">
                        <input type="date" id="filtro-data-inicio" style="width: 150px;">
                        <input type="date" id="filtro-data-fim" style="width: 150px;">
                        <select id="filtro-tipo" style="width: 150px;">
                            <option value="">Todos os tipos</option>
                            <option value="ENTRADA">Entradas</option>
                            <option value="SAIDA">Saídas</option>
                        </select>
                        <select id="filtro-material" style="width: 220px;">
                            <option value="">Todos os materiais</option>
                        </select>
                        <button class="btn btn-outline" onclick="filtrarMovimentacoes()">🔍 Filtrar</button>
                        <button class="btn btn-secondary" onclick="limparFiltroMovimentacoes()">🔄 Limpar Filtro</button>
                        <button class="btn btn-success" onclick="exportarMovimentacoes()">📊 Exportar Excel</button>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Tipo</th>
                                <th>Material</th>
                                <th>Qtd</th>
                                <th>Responsável</th>
                                <th>Documento</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-movimentacoes">
                            <tr><td colspan="6" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            

    <!-- MODAL REGISTRAR MOVIMENTAÇÃO -->
    <div id="modal-movimentacao" class="modal-overlay hidden">
        <div class="modal-confirm" style="max-width: 500px; text-align: left;">
            <h3 id="titulo-modal-movimentacao">📝 Registrar Movimentação</h3>
            <form id="form-modal-movimentacao" class="mt-2">
                <div class="form-group">
                    <label>Tipo <span class="required">*</span></label>
                    <select id="modal-mov-tipo" required>
                        <option value="">Selecione...</option>
                        <option value="ENTRADA">📥 Entrada (Recebimento)</option>
                        <option value="SAIDA">📤 Saída (Retirada)</option>
                    </select>
                </div>
                <div class="form-group mt-1">
                    <label>Material <span class="required">*</span></label>
                    <select id="modal-mov-material" required>
                        <option value="">Selecione um material...</option>
                    </select>
                </div>
                <div class="form-group mt-1">
                    <label>Quantidade <span class="required">*</span></label>
                    <input type="number" id="modal-mov-quantidade" min="1" required placeholder="Ex: 10">
                </div>
                <div class="form-group mt-1">
                    <label>Data <span class="required">*</span></label>
                    <input type="date" id="modal-mov-data" required>
                </div>
                <div class="form-group mt-1">
                    <label>Responsável</label>
                    <input type="text" id="modal-mov-responsavel" placeholder="Nome do responsável">
                </div>
                <div class="form-group mt-1">
                    <label>OM / Pedido / Reserva</label>
                    <input type="text" id="modal-mov-documento" placeholder="Nº OM, Pedido ou Reserva">
                </div>
                <div class="btn-group mt-2">
                    <button type="button" class="btn btn-primary" onclick="salvarMovimentacaoModal()">💾 Registrar</button>
                    <button type="button" class="btn btn-secondary" onclick="fecharModalMovimentacao()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

        </main>
    </div>
    <script src="../js/pages/movimentacoes.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            verificarAcesso();
            renderizarMenu();
        });
    </script>
</body>
</html>
