<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Login - Controle de Materiais</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.4rem;
        }
        .login-box p {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .login-logo {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .login-box .form-group {
            margin-bottom: 16px;
        }
        .login-box input {
            font-size: 16px;
            padding: 14px;
            min-height: 48px;
        }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            min-height: 48px;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--secondary);
        }
        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .login-box {
                padding: 24px 16px;
                border-radius: 12px;
            }
            .login-box h1 {
                font-size: 1.2rem;
            }
            .login-logo {
                font-size: 2.5rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js?v=2"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📦%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">📦</div>
            <h1>Controle de Materiais</h1>
            <p>Sistema de Gestão de Estoque</p>

            <form id="form-login">
                <div class="form-group">
                    <label>Nome de usuário <span class="required">*</span></label>
                    <input type="text" id="login-nome" required placeholder="Seu nome de usuário">
                </div>
                <div class="form-group">
                    <label>Senha <span class="required">*</span></label>
                    <input type="password" id="login-senha" required placeholder="Sua senha">
                </div>
                <button type="submit" class="btn btn-primary">🔐 Entrar</button>
            </form>

            <div class="login-footer">
                <a href="../index.html">← Voltar ao Dashboard</a>
            </div>
        </div>
    </div>
    <script src="../js/pages/login.js"></script>
</body>
</html>
