<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Materiais para Compra - Controle de Materiais</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu será renderizado dinamicamente pelo JS -->
        <main class="main-content">
            <div class="page-header">
                <h2>🛒 Materiais para Compra</h2>
                <p></p>
            </div>

            <div class="card-grid">
                <div class="stat-card">
                    <div class="stat-icon red">🚨</div>
                    <div class="stat-info">
                        <h4 id="total-compras">0</h4>
                        <p>Materiais para Comprar</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">📊</div>
                    <div class="stat-info">
                        <h4 id="total-sugerido">0</h4>
                        <p>Qtd Total Sugerida</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>📋 Lista de Compras</h3>
                    <button class="btn btn-success" onclick="exportarCompras()">📊 Exportar Excel</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Código SAP</th>
                                <th>Material</th>
                                <th>Local</th>
                                <th>Sub-local</th>
                                <th>Qtd Atual</th>
                                <th>Estoque Mín</th>
                                <th>Estoque Máx</th>
                                <th>Qtd Sugerida</th>
                                <th>Limite Compra</th>
                                <th>Unidade</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-compras">
                            <tr><td colspan="10" class="text-center">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            
        </main>
    </div>
    <script src="../js/pages/compras.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            renderizarMenu();
        });
    </script>
</body>
</html>
